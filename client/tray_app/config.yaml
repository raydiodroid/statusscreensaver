# StatusScreenSaver 配置文件

server:
  url: ""
  token: null
  reconnect_interval: 5
  heartbeat_interval: 30
  offline_mode: true

device:
  name: "未命名设备"
  location: ""
  id: null

playlist:
  auto_play: true
  interval: 30
  shuffle: false

contents: []

download:
  enabled: false
  content_server: ""
  check_interval: 300
  download_dir: "contents/downloaded"

ipc:
  pipe_name: "statusscreensaver_ipc"
  max_clients: 5

ui:
  background_color: "#000000"
  error_display_time: 5

state:
  file: "state.json"
  auto_save: true
  auto_save_interval: 60
