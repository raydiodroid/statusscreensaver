version: '3.8'

services:
  statusscreensaver:
    build: .
    image: statusscreensaver:latest
    container_name: statusscreensaver
    ports:
      - "9876:9876"
    volumes:
      - ./data:/app/data
    restart: always
    environment:
      - TZ=Asia/Shanghai
      - SCREENSAVER_API_KEY=${SCREENSAVER_API_KEY:-sk_default_key_change_me}
      - SCREENSAVER_JWT_SECRET=${SCREENSAVER_JWT_SECRET:-}
      - SCREENSAVER_TOKEN_EXPIRE_HOURS=${SCREENSAVER_TOKEN_EXPIRE_HOURS:-24}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9876/"]
      interval: 30s
      timeout: 10s
      retries: 3
