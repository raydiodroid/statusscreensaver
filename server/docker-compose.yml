version: '3.8'

services:
  screensaver-server:
    build: .
    image: screensaver-server:latest
    container_name: screensaver-server
    ports:
      - "9876:9876"
    volumes:
      - ./data:/app/data
    restart: always
    environment:
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9876/"]
      interval: 30s
      timeout: 10s
      retries: 3
